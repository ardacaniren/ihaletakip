<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tender Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f6;--card:#fff;--ink:#17202b;--mute:#5d6b7a;--line:#d8dee5;--acc:#0b6b73;--accbg:#e1f0f1;--lo:#9aa6b2;--bad:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#10161c;--card:#18212a;--ink:#e8edf2;--mute:#97a5b4;--line:#2b3744;--acc:#4fc3cc;--accbg:#173a3e;--lo:#5c6b7a;--bad:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif}
header,main,footer{max-width:1000px;margin:0 auto;padding:0 16px}
header{padding-top:28px}
h1{font-size:22px;margin:0 0 4px;font-weight:600}
.sub{color:var(--mute);margin:0 0 16px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
input,select,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
input[type=search]{flex:1 1 220px}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.count{color:var(--mute);margin-bottom:10px}
.card{display:grid;grid-template-columns:60px 1fr;gap:14px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--lo);border-radius:6px;padding:14px 16px;margin-bottom:10px}
.card.hot{border-left-color:var(--acc)}
.score{font-size:30px;font-weight:600;line-height:1;color:var(--lo);text-align:right}
.hot .score{color:var(--acc)}
.score small{display:block;font-size:12px;font-weight:400;color:var(--mute);margin-top:4px}
.title{font-weight:600;margin:0 0 2px;font-size:16px}
.title a{color:inherit;text-decoration:none}.title a:hover{text-decoration:underline}
.meta{color:var(--mute);font-size:13px;margin-bottom:8px}
.tags span{display:inline-block;background:var(--accbg);color:var(--acc);border-radius:4px;padding:1px 8px;margin:0 6px 4px 0;font-size:12px}
.ko{margin:6px 0;color:var(--mute);font-size:13px}
.files a{display:inline-block;margin:0 10px 0 0;font-size:13px;color:var(--acc)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
.empty{padding:40px 0;text-align:center;color:var(--mute)}
details{margin:24px 0 40px;color:var(--mute);font-size:13px}
.err{color:var(--bad)}
@media (max-width:520px){.card{grid-template-columns:44px 1fr}.score{font-size:24px}}
</style>
</head>
<body>
<header>
  <h1>Tender Tracker</h1>
  <p class="sub" id="upd">Loading…</p>
  <div class="bar">
    <input type="search" id="q" placeholder="Search titles" aria-label="Search titles">
    <select id="min" aria-label="Minimum score">
      <option value="0">All scores</option><option value="20" selected>Score 20+</option>
      <option value="50">Score 50+</option><option value="70">Score 70+</option></select>
    <select id="cat" aria-label="Source type"></select>
    <select id="src" aria-label="Source"></select>
    <select id="st" aria-label="Status"></select>
  </div>
  <div class="count" id="count"></div>
</header>
<main id="list"></main>
<main><button id="more" hidden>Show more</button></main>
<footer><details><summary id="hsum">Source health</summary><div id="health"></div></details></footer>
<script>
const STATUSES=["New","Pre-spec activity","Tender published","Bidding active","Won","Lost"];
let items=[],saved={},shown=50;
try{saved=JSON.parse(localStorage.getItem("status")||"{}")}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=d=>d?new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}):"No date";
const opts=(first,arr)=>`<option value="">${first}</option>`+arr.map(s=>`<option>${esc(s)}</option>`).join("");
$("st").innerHTML=opts("All statuses",STATUSES);
function setStatus(i,v){saved[items[i].link]=v;try{localStorage.setItem("status",JSON.stringify(saved))}catch(e){}render()}
window.setStatus=setStatus;
function render(){
  const q=$("q").value.toLocaleLowerCase("tr"),min=+$("min").value,cat=$("cat").value,src=$("src").value,st=$("st").value;
  const rows=items.map((it,i)=>({it,i})).filter(({it})=>it.score>=min&&(!cat||it.category===cat)&&(!src||it.source===src)
    &&(!st||(saved[it.link]||STATUSES[0])===st)&&it.title.toLocaleLowerCase("tr").includes(q))
    .sort((a,b)=>b.it.score-a.it.score||(b.it.published||b.it.first_seen).localeCompare(a.it.published||a.it.first_seen));
  $("count").textContent=`Showing ${Math.min(shown,rows.length)} of ${rows.length} matching items (${items.length} total)`;
  $("more").hidden=rows.length<=shown;
  $("list").innerHTML=rows.length?rows.slice(0,shown).map(({it,i})=>{
    const cur=saved[it.link]||STATUSES[0];
    return `<article class="card ${it.score>=70?"hot":""}"><div class="score">${it.score}<small>score</small></div><div>
      <h2 class="title"><a href="${esc(it.link)}" target="_blank" rel="noopener">${esc(it.title)}</a></h2>
      <div class="meta">${esc(it.source)}, ${esc(it.section)}, ${fmt(it.published||it.first_seen)}${it.published?"":" (first seen)"}</div>
      <div class="tags">${(it.matched||[]).map(m=>`<span>${esc(m)}</span>`).join("")}</div>
      ${it.score>=70?'<div class="ko" lang="ko">한국어 요약: pending LLM integration</div>':""}
      <div class="row"><div class="files">${it.files.map(f=>`<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a>`).join("")}</div>
      <select aria-label="Status" onchange="setStatus(${i},this.value)">${STATUSES.map(s=>`<option${s===cur?" selected":""}>${s}</option>`).join("")}</select></div>
    </div></article>`}).join(""):'<p class="empty">No items match these filters. Lower the minimum score or clear the search.</p>';
}
["q","min","cat","src","st"].forEach(id=>$(id).addEventListener("input",()=>{shown=50;render()}));
$("more").onclick=()=>{shown+=50;render()};
fetch("data.json?"+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{
  items=d.items;const h=d.sources||[];
  $("upd").textContent=d.updated?`Last updated ${d.updated.replace("T"," ").replace("Z"," UTC")}. Scored 0 to 100 by keyword rules.`:"No data yet. Run the scrape workflow.";
  $("cat").innerHTML=opts("All source types",[...new Set(items.map(i=>i.category))]);
  $("src").innerHTML=opts("All sources",[...new Set(items.map(i=>i.source))].sort());
  const bad=h.filter(s=>!s.ok);
  $("hsum").textContent=`Source health: ${h.length-bad.length} of ${h.length} sources OK`;
  $("health").innerHTML=h.map(s=>s.ok?`<div>${esc(s.name)}: ${s.found} items found</div>`:`<div class="err">${esc(s.name)}: ${esc(s.error)}</div>`).join("");
  render();
}).catch(()=>{$("upd").textContent="Could not load data.json. Open this page through GitHub Pages or a local server, not as a file."});
</script>
</body>
</html>

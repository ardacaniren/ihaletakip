<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tender Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--red:#800020;--tint:#f7edef;--ink:#231f20;--mute:#6f6769;--line:#ecdcdf;--pencil:#a39a9c;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;color:var(--ink);background:#fff;font:15px/1.55 "Work Sans",system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;border-top:8px solid var(--red)}
.wrap{max-width:980px;margin:0 auto;padding:0 18px 60px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding-top:22px}
h1{margin:0;font-size:30px;font-weight:600;letter-spacing:-.02em}
.stamp{font:700 22px "Caveat",cursive;color:var(--red);border:2.5px solid var(--red);padding:0 12px;border-radius:6px;transform:rotate(4deg);white-space:nowrap}
.sub{color:var(--mute);margin:2px 0 14px}
.lang{display:flex;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden;flex:none}.lang button{border:0;border-radius:0;border-right:1.5px solid var(--ink)}.lang button:last-child{border-right:0}.lang button.on,.lang button.on:hover{background:var(--red);color:#fff}
button,input,select{font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--ink);border-radius:4px;padding:6px 11px}
button{cursor:pointer}button:hover{background:var(--tint)}button:disabled{opacity:.5;cursor:default}
button.pri{background:var(--red);border-color:var(--red);color:#fff}button.pri:hover{background:#5c0017}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--mute)}
details{font-size:13px;color:var(--mute);margin:10px 0}details p{max-width:660px;margin:6px 0}
nav.tabs{display:flex;gap:24px;border-bottom:1.5px solid var(--ink);margin:16px 0 18px}
nav.tabs button{border:0;border-radius:0;background:none;padding:8px 2px;font-weight:500;color:var(--mute);border-bottom:4px solid transparent;margin-bottom:-1.5px}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--red)}
.star{border:0;background:none;font-size:22px;line-height:1;padding:0 6px;color:var(--red);cursor:pointer}.star:hover{background:var(--tint)}
.types{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.types button{border-radius:20px;padding:5px 14px}.types button.on{background:var(--red);border-color:var(--red);color:#fff}.types small{opacity:.75;margin-left:4px}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px}.bar input[type=search]{flex:1 1 200px}
.count{color:var(--mute);font-size:13px;margin-bottom:4px}
.item{display:grid;grid-template-columns:64px 1fr;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.ring{width:54px;height:54px;display:grid;place-items:center;font-weight:600;font-size:18px;border:2px dashed var(--pencil);color:var(--pencil);border-radius:52% 48% 55% 45%/48% 54% 46% 52%;transform:rotate(-5deg)}
.hot .ring{border:3px solid var(--red);color:var(--red)}
.t{font-size:16px;font-weight:600;margin:0}.t a{color:inherit;text-decoration:none}.t a:hover{color:var(--red);text-decoration:underline}
.meta{color:var(--mute);font-size:13px}
.note{font:600 19px/1.1 "Caveat",cursive;color:var(--red);margin:4px 0}
.ko{color:var(--mute);font-size:13px;margin:2px 0}
.files a{margin-right:12px;font-size:13px;color:var(--red)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px}
.empty{padding:36px 0;color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;font-weight:600;border-bottom:1.5px solid var(--ink);padding:6px 8px 6px 0}
td{padding:8px 8px 8px 0;border-bottom:1px solid var(--line);vertical-align:top;word-break:break-word}
.ok{color:#256b3a}.bad{color:var(--red)}
.add{display:grid;grid-template-columns:2fr 1.2fr 1fr 1fr auto;gap:8px;margin:14px 0}
.add input,.add select{min-width:0}
.kw{border-bottom:1px solid var(--line);padding:14px 0}.kw h3{margin:0 0 6px;font-size:15px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.kw h3 input{width:68px;padding:3px 6px}
.chip{display:inline-flex;gap:6px;align-items:center;border:1.5px solid var(--ink);border-radius:20px;padding:0 4px 0 11px;margin:0 6px 6px 0;font-size:13px}
.chip button{border:0;background:none;padding:0 6px;font-size:16px;line-height:1.3;color:var(--red)}
.save{position:sticky;bottom:0;background:#fff;border-top:2px solid var(--red);padding:10px 0;margin-top:16px;display:flex;gap:12px;align-items:center}
@media (max-width:640px){.add{grid-template-columns:1fr}.item{grid-template-columns:50px 1fr}.ring{width:46px;height:46px;font-size:16px}}
.files details{display:inline}.files summary{display:inline;cursor:pointer;color:var(--red);font-size:13px}
.badge{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid currentColor;margin-right:6px}.badge.comp{color:#b45309}.badge.own{color:#2e7d32}
.notes{display:flex;gap:6px;margin-top:6px}.notes input{font:inherit;font-size:13px;padding:3px 6px;border:1px solid #ccc;border-radius:4px;min-width:0}.notes .own{width:110px}.notes .nt{flex:1}
#sum h3{margin:18px 0 6px}#sum ul{padding-left:18px;margin:4px 0}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 16px}.kpi button{text-align:left;cursor:pointer;font:inherit;color:inherit;border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:#fff}.kpi button:hover,.kpi button:focus-visible{border-color:var(--red);background:var(--tint)}.kpi b{display:block;font-size:26px;line-height:1.1;color:var(--red)}.kpi span{font-size:13px;color:var(--mute)}
@media(max-width:640px){.kpi{grid-template-columns:repeat(2,1fr)}}
@media print{.tools,nav.tabs,.bar,#savebar,#tokbox,.lang,#exp,#showdis,.types{display:none!important}body{background:#fff}}
nav.tabs{overflow-x:auto;-webkit-overflow-scrolling:touch}nav.tabs button{white-space:nowrap;flex:none}
.item>div{min-width:0}.notes .nt{width:0}
dialog#dlg{width:min(720px,94vw);max-height:80vh;border:1px solid var(--line);border-radius:8px;padding:0;color:var(--ink)}dialog#dlg::backdrop{background:rgba(0,0,0,.4)}
#dlg .dh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}#dlg h3{margin:0}#dlg .dh button{font-size:20px;line-height:1;padding:2px 10px;cursor:pointer}#dlgb{padding:8px 16px 16px}#dlgb ul{padding-left:18px;margin:6px 0}#dlgb li{margin:8px 0}@media print{dialog#dlg{display:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header><div><h1 id="ttl" data-i18n="title"></h1><p class="sub" id="upd"></p></div>
<div class="lang" role="group" data-i18n-aria="lang_aria"><button data-l="tr">Türkçe</button><button data-l="en">English</button><button data-l="ko">한국어</button></div></header>
<div class="tools"><button class="pri" id="run" data-i18n="update"></button><span id="runstat" aria-live="polite"></span></div>
<details id="tokbox"><summary data-i18n="tok_sum"></summary>
<p data-i18n="tok_help"></p>
<input type="password" id="tok" placeholder="github_pat_…" aria-label="GitHub token"> <button id="savetok" data-i18n="tok_save"></button> <button id="cleartok" data-i18n="tok_clear"></button></details>
<nav class="tabs"><button class="on" data-p="opps" data-i18n="tab_opps"></button><button data-p="saved" id="savedtab"></button><button data-p="srcs" data-i18n="tab_srcs"></button><button data-p="kws" data-i18n="tab_kws"></button><button data-p="sum" data-i18n="tab_sum"></button></nav>

<section id="opps">
<div class="kpi" id="kpi"></div>
<dialog id="dlg" aria-labelledby="dlgt"><div class="dh"><h3 id="dlgt"></h3><button id="dlgx" type="button">×</button></div><div id="dlgb"></div></dialog>
<div class="types" id="types" role="group" data-i18n-aria="types_aria"></div>
<div class="bar"><input type="search" id="q" data-i18n-ph="q_ph" data-i18n-aria="q_ph">
<select id="min" data-i18n-aria="min_aria"><option value="0" data-i18n="min_all"></option><option value="20" selected data-n="20"></option><option value="40" data-n="40"></option><option value="60" data-n="60"></option><option value="70" data-n="70"></option></select>
<select id="cat" data-i18n-aria="cat_aria"></select><select id="src" data-i18n-aria="src_aria"></select><select id="st" data-i18n-aria="st_aria"></select>
<select id="sort" data-i18n-aria="sort_aria"><option value="score" data-i18n="sort_score"></option><option value="published" data-i18n="sort_published"></option><option value="found" data-i18n="sort_found"></option></select></div>
<div class="count" id="count"></div><p><button id="exp" data-i18n="exp"></button> <label class="meta"><input type="checkbox" id="showdis"> <span data-i18n="show_dis"></span></label></p><div id="list"></div><p><button id="more" hidden data-i18n="more"></button></p>
</section>

<section id="sum" hidden><div id="sumbody"></div></section>

<section id="srcs" hidden>
<p class="meta" data-i18n="srcs_help"></p>
<table><thead><tr><th data-i18n="th_name"></th><th data-i18n="th_type"></th><th data-i18n="th_cat"></th><th data-i18n="th_last"></th><th></th></tr></thead><tbody id="srows"></tbody></table>
<div class="add"><input id="aurl" data-i18n-ph="a_url_ph" data-i18n-aria="a_url_ph"><input id="aname" data-i18n-ph="a_name_ph" data-i18n-aria="a_name_ph">
<select id="atype" data-i18n-aria="th_type"><option value="" data-i18n="a_type_auto"></option><option>tr</option><option>list</option></select>
<select id="acat" data-i18n-aria="th_cat"></select><button class="pri" id="aadd" data-i18n="a_add"></button></div>
</section>

<section id="kws" hidden>
<p class="meta" data-i18n="kw_help"></p>
<div id="kwlist"></div>
</section>
<div class="save" id="savebar" hidden><span id="dirty"></span><button class="pri" id="save" data-i18n="save_update"></button></div>
<p class="meta" style="margin-top:30px" data-i18n="footer"></p>
</div>

async function fillMissing(rows){
  if(lang==="tr")return;const L=lang;
  const need=rows.filter(({it})=>!it["title_"+L]&&!tcache[L+"|"+it.link]&&!tfail.has(L+"|"+it.link));
  if(!need.length)return;let got=0;
  for(let i=0;i<need.length;i+=6){
    await Promise.all(need.slice(i,i+6).map(async({it})=>{const k=L+"|"+it.link;
      try{const r=await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=tr&tl="+L+"&dt=t&q="+encodeURIComponent(it.title));
        if(!r.ok)throw 0;const j=await r.json();const x=j[0].map(y=>y[0]).join("").trim();if(!x)throw 0;tcache[k]=x;got++}
      catch(e){tfail.add(k)}}));
    if(L!==lang)return}
  if(got){try{localStorage.setItem("tcache",JSON.stringify(tcache))}catch(e){}renderOpps()}}
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));

const fold=s=>String(s).replace(/İ/g,"i").replace(/I/g,"ı").toLowerCase().replace(/[ışğüöç]/g,c=>({"ı":"i","ş":"s","ğ":"g","ü":"u","ö":"o","ç":"c"})[c]);
const BID_T=/\b(ihale|satin al|alim|teklif|sartname|yaklasik maliyet|dogrudan temin|pazarlik)/,BID_F=/sartname|ihale|teklif/,NOT_BID=/personel|sozlesmeli|memur|kadro|yedek|isci/;
const FILE_KEY=/vucut|analiz|inbody|bia|kompozisyon|sartname|teklif/;
function typeOf(it){
  if(it.category==="Research & grants"||it.category==="University BAP")return "grants";
  if(it.section==="Tenders")return "bid";
  if(it.section==="News"||it.category==="News")return "news";
  const x=fold(it.title);
  if((BID_T.test(x)&&!NOT_BID.test(x))||it.files.some(f=>BID_F.test(fold(f.name))))return "bid";
  return "ann";}
$("types").onclick=e=>{const b=e.target.closest("button");if(!b)return;type=b.dataset.t;shown=50;
  $("min").value=(type==="all"||type==="bid")?"20":"0";renderOpps()};
const dkey=it=>it.published||it.first_seen||"";
const SORTS={score:(a,b)=>b.it.score-a.it.score||dkey(b.it).localeCompare(dkey(a.it)),
  published:(a,b)=>dkey(b.it).localeCompare(dkey(a.it))||b.it.score-a.it.score,
  found:(a,b)=>(b.it.first_seen||"").localeCompare(a.it.first_seen||"")||b.it.score-a.it.score};

function setStatus(i,v){saved[items[i].link]=v;try{localStorage.setItem("status",JSON.stringify(saved))}catch(e){}renderOpps()}
function renderOpps(){
  const q=$("q").value.toLocaleLowerCase("tr"),min=+$("min").value,cat=$("cat").value,src=$("src").value,st=$("st").value,sd=$("showdis").checked;
  const base0=items.map((it,i)=>({it,i})).filter(({it})=>(sd||!dismissed[it.link])&&(savedOnly?starred.has(it.link):it.score>=min)&&(!cat||it.category===cat)&&(!src||it.source===src)&&(!st||(saved[it.link]||STATUSES[0])===st)&&[it.title,it.title_en,it.title_ko].join(" ").toLocaleLowerCase("tr").includes(q))
    .sort(SORTS[$("sort").value]);
  const seen=new Map(),base=[];
  for(const r of base0){const k=fold(r.it.title).replace(/[^a-z0-9]/g,"");const f=seen.get(k);
    if(f){if(f.it.source!==r.it.source&&!f.alts.includes(r.it.source))f.alts.push(r.it.source)}else{r.alts=[];seen.set(k,r);base.push(r)}}
  const cnt={all:base.length};TYPES.forEach(k=>cnt[k]=0);base.forEach(({it})=>cnt[typeOf(it)]++);
  $("types").innerHTML=["all",...TYPES].map(k=>`<button data-t="${k}" class="${k===type?"on":""}" aria-pressed="${k===type}">${esc(t("ty_"+k))}<small>${cnt[k]}</small></button>`).join("");
  const rows=type==="all"?base:base.filter(({it})=>typeOf(it)===type);
  lastRows=rows;
  $("count").textContent=savedOnly?t("saved_note",{n:rows.length}):t("matching",{n:rows.length,m:min,t:items.length});
  $("savedtab").textContent=t("tab_saved",{n:starred.size});$("more").hidden=rows.length<=shown;
  $("list").innerHTML=rows.length?rows.slice(0,shown).map(({it,i,alts})=>{const cur=saved[it.link]||STATUSES[0];
    const star=starred.has(it.link);
    const fs=[...it.files].sort((a,b)=>FILE_KEY.test(fold(b.name))-FILE_KEY.test(fold(a.name)));
    const fl=f=>`<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a>`;
    const files=fs.slice(0,4).map(fl).join("")+(fs.length>4?`<details><summary>${esc(t("files_more",{n:fs.length-4}))}</summary>${fs.slice(4).map(fl).join("")}</details>`:"");
    const hasTr=it["title_"+lang]||tcache[lang+"|"+it.link];
    return `<article class="item ${it.score>=70?"hot":""}"><div class="ring">${it.score}</div><div>
    <h2 class="t" lang="${lang}"><a href="${esc(it.link)}" target="_blank" rel="noopener">${esc(tt(it))}</a></h2>
    ${lang!=="tr"?`<div class="meta" lang="tr">${hasTr?esc(t("orig"))+esc(it.title):esc(tfail.has(lang+"|"+it.link)?t("unavail"):t("translating"))}</div>`:""}
    <div class="meta">${esc(t("ty_"+typeOf(it)))}, ${esc(it.source)}, ${it.published?esc(t("meta_pub",{d:fmt(it.published)})):esc(t("meta_unk"))}, ${esc(t("meta_found",{d:fmt(it.first_seen)}))}</div>
    ${(it.matched||[]).length?`<div class="note">${esc(t("matched"))}${esc(it.matched.join(", "))}</div>`:""}
    ${(()=>{const m=(it.matched||[]).map(x=>String(x).replace(/ \(in file\)$/,"").toLowerCase());const c=COMP.filter(x=>m.includes(x));
      return (c.length?`<span class="badge comp">${esc(t("comp",{n:c.join(", ")}))}</span>`:"")+(m.includes("inbody")?`<span class="badge own">${esc(t("own"))}</span>`:"")+((alts||[]).length?`<span class="meta">${esc(t("alts",{s:alts.join(", ")}))}</span>`:"")})()}
    ${it.score>=70?`<div class="ko" lang="ko">${esc(t("ko_sum"))}</div>`:""}
    <div class="notes"><input class="own" value="${esc((notes[it.link]||{}).owner||"")}" placeholder="${esc(t("owner_ph"))}" aria-label="${esc(t("owner_ph"))}" onchange="saveNote(${i},this.parentNode)"><input class="nt" value="${esc((notes[it.link]||{}).note||"")}" placeholder="${esc(t("note_ph"))}" aria-label="${esc(t("note_ph"))}" onchange="saveNote(${i},this.parentNode)"></div>
    <div class="foot"><div class="files"><button class="star" onclick="toggleStar(${i})" aria-label="${esc(t(star?"star_rm":"star_add"))}" aria-pressed="${star}" title="${esc(t(star?"star_on":"star_off"))}">${star?"★":"☆"}</button><button class="star" onclick="toggleDismiss(${i})" aria-label="${esc(t(dismissed[it.link]?"dis_off":"dis_on"))}" aria-pressed="${!!dismissed[it.link]}" title="${esc(t(dismissed[it.link]?"dis_off":"dis_on"))}">⊘</button>${files}</div>
    <select aria-label="${esc(t("st_aria"))}" onchange="setStatus(${i},this.value)">${STATUSES.map(s=>`<option value="${esc(s)}"${s===cur?" selected":""}>${esc(lab("st_",s))}</option>`).join("")}</select></div></div></article>`}).join(""):`<p class="empty">${esc(t("empty"))}</p>`;
  fillMissing(rows.slice(0,shown));renderSum();
}
["q","min","cat","src","st","sort","showdis"].forEach(id=>$(id).addEventListener("input",()=>{shown=50;renderOpps()}));$("more").onclick=()=>{shown+=50;renderOpps()};

/* CSV export of the currently filtered list (UTF-8 with BOM so Excel reads Turkish and Korean) */
$("exp").onclick=()=>{
  const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  const head=["score","title_tr","title_"+lang,"type","source","category","published","found","link","matched","files"];
  const rows=lastRows.map(({it})=>[it.score,it.title,tt(it),typeOf(it),it.source,it.category,it.published||"",it.first_seen||"",it.link,(it.matched||[]).join("; "),it.files.map(f=>f.name).join("; ")]);
  const csv="\ufeff"+[head,...rows].map(r=>r.map(q).join(",")).join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download="ihale-listesi-"+new Date().toISOString().slice(0,10)+".csv";document.body.appendChild(a);a.click();a.remove()};

/* sources */
let editI=-1;
function renderSrcs(){$("srows").innerHTML=sources.map((s,i)=>{const h=health[s.name];
  const st=h?(h.ok?`<span class="ok">${esc(t("items_n",{n:h.found}))}</span>`:`<span class="bad">${esc(h.error)}</span>`):esc(t("not_run"));
  const wb=h&&h.streak>=3?` <span class="bad">⚠ ${esc(t("streak",{n:h.streak}))}</span>`:"";
  if(i===editI)return `<tr><td><b>${esc(s.name)}</b><br><input id="e_url" value="${esc(s.url)}" aria-label="URL" style="width:100%"></td>
  <td><select id="e_type" aria-label="${esc(t("th_type"))}">${["tr","list","ilan"].map(x=>`<option${x===s.type?" selected":""}>${x}</option>`).join("")}</select></td>
  <td><select id="e_cat" aria-label="${esc(t("th_cat"))}">${CATS.map(c=>`<option value="${esc(c)}"${c===s.category?" selected":""}>${esc(lab("cat_",c))}</option>`).join("")}</select></td>
  <td>${st}${wb}</td><td><button class="pri" onclick="saveSrc(${i})">${esc(t("row_ok"))}</button> <button onclick="editSrc(-1)">${esc(t("row_cancel"))}</button></td></tr>`;
  return `<tr><td><b>${esc(s.name)}</b><br><a class="meta" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url)}</a></td><td>${esc(s.type)}</td><td>${esc(lab("cat_",s.category))}</td>
  <td>${st}${wb}</td><td><button onclick="editSrc(${i})" aria-label="${esc(t("edit_aria",{n:s.name}))}">${esc(t("edit"))}</button> <button onclick="delSrc(${i})" aria-label="${esc(t("remove_aria",{n:s.name}))}">${esc(t("remove"))}</button></td></tr>`}).join("")}
function editSrc(i){editI=i;renderSrcs()}
function saveSrc(i){let u;try{u=new URL($("e_url").value.trim());if(!/^https?:$/.test(u.protocol))throw 0}catch(e){alert(t("al_url"));return}
  if(sources.some((s,j)=>j!==i&&s.url===u.href)){alert(t("al_dup"));return}
  const s=sources[i];s.url=u.href;s.type=$("e_type").value;s.category=$("e_cat").value;editI=-1;markDirty("sources");renderSrcs()}
function delSrc(i){sources.splice(i,1);markDirty("sources");renderSrcs()}
$("aadd").onclick=()=>{let u;try{u=new URL($("aurl").value.trim())}catch(e){alert(t("al_url"));return}
  if(sources.some(s=>s.url===u.href)){alert(t("al_dup"));return}
  const ty=$("atype").value||(u.hostname.endsWith("saglik.gov.tr")?"tr":"list");
  sources.push({name:$("aname").value.trim()||u.hostname.replace(/^www\./,"")+u.pathname.replace(/\/$/,""),url:u.href,type:ty,category:$("acat").value});
  $("aurl").value=$("aname").value="";markDirty("sources");renderSrcs()};

/* keywords */
function renderKw(){$("kwlist").innerHTML=Object.entries(kw.categories).map(([k,c])=>`<div class="kw"><h3>${esc(lab("kw_",k))}
  <label class="meta">${esc(t("weight"))} <input type="number" value="${c.weight}" onchange="setW('${k}',this.value)" aria-label="${esc(t("weight_aria"))}"></label></h3>
  ${c.terms.map((x,i)=>`<span class="chip">${esc(x)}<button onclick="delTerm('${k}',${i})" aria-label="${esc(t("rm_term",{t:x}))}">×</button></span>`).join("")}
  <div><input id="n_${k}" placeholder="${esc(t("add_term"))}" aria-label="${esc(t("new_term"))}" onkeydown="if(event.key==='Enter')addTerm('${k}')"> <button onclick="addTerm('${k}')">${esc(t("add"))}</button></div></div>`).join("")}
function setW(k,v){kw.categories[k].weight=+v||0;markDirty("keywords")}
function delTerm(k,i){kw.categories[k].terms.splice(i,1);markDirty("keywords");renderKw()}
function addTerm(k){const v=$("n_"+k).value.trim().toLowerCase();if(!v)return;if(!kw.categories[k].terms.includes(v))kw.categories[k].terms.push(v);markDirty("keywords");renderKw();$("n_"+k).focus()}

/* save to GitHub */
const b64=s=>btoa(unescape(encodeURIComponent(s)));
async function putFile(path,obj){const u=API+"/contents/"+path,cur=await(await fetch(u,{headers:hdr()})).json();
  const r=await fetch(u,{method:"PUT",headers:hdr(),body:JSON.stringify({message:"Update "+path+" from dashboard",content:b64(JSON.stringify(obj,null,1)),sha:cur.sha,branch:"main"})});
  if(!r.ok)throw new Error("HTTP "+r.status)}

/* shared flags: starred.json, dismissed.json, notes.json in the repository */
async function saveShared(file,mut){
  for(let a=0;a<3;a++){
    const u=API+"/contents/"+file;const r=await fetch(u,{headers:hdr()});let sha,obj={items:{}};
    if(r.status===200){const c=await r.json();sha=c.sha;obj=JSON.parse(decodeURIComponent(escape(atob(c.content.replace(/\n/g,"")))))}
    else if(r.status!==404)throw new Error("HTTP "+r.status);
    obj.items=obj.items||{};mut(obj.items);
    const body={message:"Update "+file+" from dashboard",content:b64(JSON.stringify(obj,null,1)),branch:"main"};if(sha)body.sha=sha;
    const w=await fetch(u,{method:"PUT",headers:hdr(),body:JSON.stringify(body)});
    if(w.ok)return;if(w.status!==409&&w.status!==422)throw new Error("HTTP "+w.status)}
  throw new Error(t("s_conflict"))}
const saveStar=(link,on)=>saveShared("starred.json",o=>{if(on)o[link]={at:new Date().toISOString()};else delete o[link]});
async function readShared(f){
  if(tok()){try{const r=await fetch(API+"/contents/"+f+"?ref=main",{headers:{...hdr(),Accept:"application/vnd.github.raw+json"}});
    if(r.ok)return(await r.json()).items||{};if(r.status===404)return{}}catch(e){}}
  try{return(await jget(f)).items||{}}catch(e){return{}}}
async function loadStars(){const[s,d,n]=await Promise.all([readShared("starred.json"),readShared("dismissed.json"),readShared("notes.json")]);starred=new Set(Object.keys(s));dismissed=d;notes=n}
async function toggleStar(i){
  const link=items[i].link;
  if(!tok()){$("tokbox").open=true;say(t("s_connect_star"));return}
  const was=starred.has(link);was?starred.delete(link):starred.add(link);renderOpps();
  try{await saveStar(link,!was);say(t(was?"s_unstar":"s_star"))}
  catch(e){was?starred.add(link):starred.delete(link);renderOpps();say(t("s_starfail",{e:e.message}))}}
async function toggleDismiss(i){
  const it=items[i],link=it.link;
  if(!tok()){$("tokbox").open=true;say(t("s_connect_star"));return}
  const was=!!dismissed[link],prev=dismissed[link];
  if(was)delete dismissed[link];else dismissed[link]={at:new Date().toISOString(),title:it.title};renderOpps();
  try{await saveShared("dismissed.json",o=>{if(was)delete o[link];else o[link]={at:new Date().toISOString(),title:it.title}});say(t(was?"s_undis":"s_dis"))}
  catch(e){if(was)dismissed[link]=prev;else delete dismissed[link];renderOpps();say(t("s_starfail",{e:e.message}))}}
async function saveNote(i,box){
  const link=items[i].link;
  if(!tok()){$("tokbox").open=true;say(t("s_connect_star"));return}
  const owner=box.querySelector(".own").value.trim(),note=box.querySelector(".nt").value.trim();
  try{await saveShared("notes.json",o=>{if(owner||note)o[link]={owner,note,at:new Date().toISOString()};else delete o[link]});
    if(owner||note)notes[link]={owner,note};else delete notes[link];say(t("s_note_ok"))}
  catch(e){say(t("s_starfail",{e:e.message}))}}

/* weekly summary (computed in the browser from data.json) */
function renderKpi(){
  const cut=new Date(Date.now()-7*864e5).toISOString().slice(0,10),ok=items.filter(i=>!dismissed[i.link]);
  const v=[[ok.filter(i=>i.score>=20).length,"kpi_rel"],[ok.filter(i=>i.score>=70).length,"kpi_hot"],[ok.filter(i=>i.score>=20&&(i.first_seen||"")>=cut).length,"kpi_new"],[starred.size,"kpi_saved"]];
  $("kpi").innerHTML=v.map(([n,k])=>`<button type="button" data-k="${k}"><b>${n}</b><span>${esc(t(k))}</span></button>`).join("")}
function kpiItems(k){
  const cut=new Date(Date.now()-7*864e5).toISOString().slice(0,10),ok=items.filter(i=>!dismissed[i.link]);
  const f={kpi_rel:i=>i.score>=20,kpi_hot:i=>i.score>=70,kpi_new:i=>i.score>=20&&(i.first_seen||"")>=cut,kpi_saved:i=>starred.has(i.link)}[k];
  return (k==="kpi_saved"?items:ok).filter(f).sort((a,b)=>b.score-a.score||dkey(b).localeCompare(dkey(a)))}
function openKpi(k){
  const rows=kpiItems(k);$("dlgt").textContent=t(k)+" ("+rows.length+")";$("dlgx").setAttribute("aria-label",t("close"));
  $("dlgb").innerHTML=rows.length?`<ul>${rows.map(i=>`<li><b>${i.score}</b> <a href="${esc(i.link)}" target="_blank" rel="noopener">${esc(tt(i))}</a><br><span class="meta">${esc(i.source)}, ${i.published?esc(t("meta_pub",{d:fmt(i.published)})):esc(t("meta_unk"))}, ${esc(t("meta_found",{d:fmt(i.first_seen)}))}</span></li>`).join("")}</ul>`:`<p class="meta">${esc(t("dlg_empty"))}</p>`;
  const d=$("dlg");if(d.showModal){if(!d.open)d.showModal()}else d.setAttribute("open","")}
$("kpi").onclick=e=>{const b=e.target.closest("button");if(b)openKpi(b.dataset.k)};
$("dlgx").onclick=()=>$("dlg").close();
$("dlg").addEventListener("click",e=>{if(e.target===$("dlg"))$("dlg").close()});
function renderSum(){
  renderKpi();
  const cut=new Date(Date.now()-7*864e5).toISOString().slice(0,10);
  const nw=items.filter(i=>(i.first_seen||"")>=cut&&!dismissed[i.link]);
  const hot=nw.filter(i=>i.score>=70).sort((a,b)=>b.score-a.score);
  const by={};nw.filter(i=>i.score>=20).forEach(i=>by[i.source]=(by[i.source]||0)+1);
  const names=[...new Set([...sources.map(s=>s.name),...Object.keys(health)])];
  const all=names.map(n=>({n,new:by[n]||0,h:health[n]})).sort((a,b)=>b.new-a.new||a.n.localeCompare(b.n));
  const bad=Object.values(health).filter(h=>(h.streak||0)>=3);
  $("sumbody").innerHTML=`<p>${esc(t("sum_counts",{n:nw.filter(i=>i.score>=20).length}))}</p>
  <h3>${esc(t("sum_h_new"))}</h3>${hot.length?`<ul>${hot.map(i=>`<li><b>${i.score}</b> <a href="${esc(i.link)}" target="_blank" rel="noopener">${esc(tt(i))}</a> <span class="meta">${esc(i.source)}</span></li>`).join("")}</ul>`:`<p class="meta">${esc(t("sum_none"))}</p>`}
  ${all.length?`<h3>${esc(t("sum_src"))}</h3><table><thead><tr><th>${esc(t("th_name"))}</th><th>${esc(t("sum_new"))}</th><th>${esc(t("sum_tot"))}</th></tr></thead><tbody>${all.map(r=>`<tr><td>${esc(r.n)}</td><td>${r.new}</td><td>${r.h?(r.h.ok?r.h.found:`<span class="bad">${esc(t("sum_err"))}</span>`):"–"}</td></tr>`).join("")}</tbody></table>`:""}
  ${bad.length?`<h3>${esc(t("sum_fail"))}</h3><ul>${bad.map(h=>`<li>${esc(h.name)}: ${esc(t("streak",{n:h.streak}))}</li>`).join("")}</ul>`:""}`}

/* data */
async function jget(f){const r=await fetch(f+"?"+Date.now());if(!r.ok)throw 0;return r.json()}
async function load(){try{await loadStars();const d=await jget("data.json");items=d.items;health={};(d.sources||[]).forEach(h=>health[h.name]=h);
  catList=[...new Set(items.map(i=>i.category))];srcList=[...new Set(items.map(i=>i.source))].sort();
  updRaw=d.updated||"";updErr=false;
  if(!dirty.has("sources")){try{sources=await jget("sources.json")}catch(e){}}
  if(!dirty.has("keywords")){try{kw=await jget("keywords.json")}catch(e){}}
  fillSelects();setUpd();renderOpps();renderSrcs();renderKw()}catch(e){updErr=true;setUpd()}}
async function lastRun(){try{const j=await(await fetch(API+"/actions/workflows/scrape.yml/runs?per_page=1",{headers:hdr()})).json();return j.workflow_runs&&j.workflow_runs[0]||null}catch(e){return null}}
let lastR=undefined;function paintLast(){const r=lastR;say(r?t("s_last",{d:fmt(r.updated_at),tm:new Date(r.updated_at).toLocaleTimeString(LOC[lang],{hour:"2-digit",minute:"2-digit"}),s:r.status==="completed"?r.conclusion:r.status}):t("s_last_na"))}
async function showLast(){lastR=await lastRun();paintLast()}
async function update(){
  if(!tok()){$("tokbox").open=true;say(t("s_connect"));return}
  $("run").disabled=$("save").disabled=true;const free=()=>{$("run").disabled=$("save").disabled=false};
  try{if(dirty.has("sources")||dirty.has("keywords")){say(t("s_saving"));
      if(dirty.has("sources"))await putFile("sources.json",sources);if(dirty.has("keywords"))await putFile("keywords.json",kw);
      dirty.clear();$("savebar").hidden=true}}
  catch(e){say(t("s_savefail",{e:e.message}));free();return}
  say(t("s_starting"));const before=await lastRun();
  const r=await fetch(API+"/actions/workflows/scrape.yml/dispatches",{method:"POST",headers:hdr(),body:JSON.stringify({ref:"main"})});
  if(r.status!==204){say(t("s_nostart",{c:r.status}));free();return}
  for(let i=0;i<60;i++){await sleep(10000);const c=await lastRun();
    if(c&&(!before||c.id!==before.id)){if(c.status==="completed"){say(t("s_done",{c:c.conclusion}));await sleep(75000);await load();await showLast();free();return}say(t("s_running"))}else say(t("s_waiting"))}
  say(t("s_long"));free()}
$("run").onclick=update;$("save").onclick=update;
$("savetok").onclick=()=>{try{localStorage.setItem("gh_token",$("tok").value.trim());$("tok").value="";say(t("s_tok_saved"))}catch(e){say(t("s_tok_fail"))}};
$("cleartok").onclick=()=>{try{localStorage.removeItem("gh_token")}catch(e){}say(t("s_tok_rm"))};
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem("lang",lang)}catch(e){}applyLang()});
setInterval(()=>{if(!dirty.size)load()},300000);applyLang();load();showLast();
</script>
